# Opened pre-filled by the editor's Submit button. The field ids and labels are
# read back by src/utils/submission.ts — change them together.
name: Submit an icon
description: Add an icon to the Knurled Icons library.
title: 'Icon: '
labels: [icon-submission]
body:
  - type: markdown
    attributes:
      value: |
        **The title is the icon's name**: keep it as `Icon: <name>`, for
        example `Icon: gear check`. It becomes the file name `gear-check.svg`.

        Filing this opens a pull request that adds the icon to the library, with
        a preview. Once a maintainer merges it, the icon is free to download from
        [icons.knurled.studio/icons](https://icons.knurled.studio/icons/). Edit
        this issue and the pull request updates to match.

  # One option per key in library/categories.json; src/library.test.ts fails
  # if the two lists drift apart.
  - type: dropdown
    id: categories
    attributes:
      label: Categories
      description: Optional. Where the icon is shelved in the gallery; leave it empty if none fit.
      multiple: true
      options:
        - editor
        - hardware
        - measure
        - shapes

  - type: input
    id: tags
    attributes:
      label: Tags
      description: |
        Comma-separated, lowercase words people might search for. Leave out
        words already in the name.
      placeholder: settings, done, cog

  - type: textarea
    id: svg
    attributes:
      label: SVG
      description: |
        Filled in by the editor. If it is empty, the icon was too large for the
        link — the editor copied it to your clipboard, so paste it here.
      render: xml
    validations:
      required: true

  - type: checkboxes
    id: license
    attributes:
      label: License
      options:
        - label: I made this icon, and I release it under the MIT License.
          required: true
