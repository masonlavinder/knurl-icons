# Opened pre-filled by the editor's Submit button. The field ids and labels are
# read back by src/utils/submission.ts — change them together.
name: Submit an icon
description: Add an icon to the Knurled Icons library.
title: 'Icon: '
labels: [icon-submission]
body:
  - type: markdown
    attributes:
      value: |
        Submissions are reviewed by hand. Once approved, a pull request adds the
        icon to the library and it becomes free to download from
        [icons.knurled.studio/icons](https://icons.knurled.studio/icons/).

  - type: input
    id: name
    attributes:
      label: Name
      description: kebab-case, like `gear-check`. This becomes the file name.
      placeholder: gear-check
    validations:
      required: true

  # One option per key in library/categories.json; src/library.test.ts fails
  # if the two lists drift apart.
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Where the icon is filed in the gallery.
      options:
        - editor
        - hardware
        - measure
        - shapes
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: |
        Comma-separated, lowercase words people might search for. Leave out
        words already in the name.
      placeholder: settings, done, cog

  - type: textarea
    id: svg
    attributes:
      label: SVG
      description: |
        Filled in by the editor. If it is empty, the icon was too large for the
        link — the editor copied it to your clipboard, so paste it here.
      render: xml
    validations:
      required: true

  - type: checkboxes
    id: license
    attributes:
      label: License
      options:
        - label: I made this icon, and I release it under the MIT License.
          required: true
