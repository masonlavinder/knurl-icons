name: Accept icon

# Filing an icon-submission issue opens a pull request that adds the icon to
# library/icons/, and editing the issue updates that PR. Nothing is published
# until a maintainer merges it: the merge is a push to main, so the deploy
# workflow runs as for any commit. The PR is the review step.
#
# Anyone can file an issue, so this runs on untrusted input. What reaches the
# repo is only ever the serializer's output on a branch, never the issue text,
# and only a maintainer can merge the branch.
#
# `labeled` is there for an issue filed before the label existed, or by hand:
# adding icon-submission to it runs this as if it had just been filed.
on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: accept-icon-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  accept:
    # The form applies icon-submission when the issue is filed. A closed issue
    # has either been merged or abandoned, so its edits are left alone.
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'icon-submission') &&
      (github.event.action != 'labeled' || github.event.label.name == 'icon-submission')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The title, body and author are untrusted text, so they travel as
      # environment variables. Interpolating them into a `run:` line would let
      # an issue run commands.
      - id: icon
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node scripts/accept-icon.ts

      # NAME has already been checked against the kebab-case rule, so it is
      # safe in a branch name and a commit message.
      - env:
          NAME: ${{ steps.icon.outputs.name }}
        run: |
          branch="icon/$NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add "library/icons/$NAME.svg" "library/icons/$NAME.json"
          git commit -m "Add $NAME icon" -m "Closes #$NUMBER"
          git push --force origin "$branch"

          # Pinned to the commit, so the preview shows exactly what merges
          # even if the branch is pushed again.
          sha=$(git rev-parse HEAD)
          file="${{ github.server_url }}/${{ github.repository }}/blob/$sha/library/icons/$NAME.svg"
          preview() {
            printf '<img src="%s?raw=true" width="96" height="96" alt="%s">\n\n' "$file" "$NAME"
            printf 'Generated file: [`library/icons/%s.svg`](%s)\n' "$NAME" "$file"
          }

          { printf 'Adds `%s` from #%s. Merging publishes it to the icon library.\n\n' "$NAME" "$NUMBER"
            preview
            printf '\nCloses #%s\n' "$NUMBER"; } > pr-body.md

          # An edit to the issue force-pushes the branch above, so an open PR
          # already shows the new file; only its preview needs refreshing.
          if gh pr view "$branch" --json state --jq .state 2> /dev/null | grep -qx OPEN; then
            gh pr edit "$branch" --body-file pr-body.md
          else
            pr=$(gh pr create --head "$branch" --title "Add $NAME icon" --body-file pr-body.md)
            { printf 'Pull request opened: %s\n\n' "$pr"; preview; } > issue-comment.md
            gh issue comment "$NUMBER" --body-file issue-comment.md
          fi

      - if: failure()
        run: |
          if [ -f accept-error.md ]; then
            gh issue comment "$NUMBER" --body-file accept-error.md
          else
            gh issue comment "$NUMBER" --body "Something went wrong adding this icon: see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
